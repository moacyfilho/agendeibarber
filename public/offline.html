<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Agendei Barber</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030303;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 320px; }
    .icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #f97316, #c2410c);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      box-shadow: 0 0 40px rgba(249,115,22,0.3);
    }
    h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 10px; }
    p  { font-size: 14px; color: #71717a; line-height: 1.6; margin-bottom: 28px; }
    button {
      background: #f97316;
      color: #000;
      border: none;
      padding: 13px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #fb923c; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✂️</div>
    <h1>Você está offline</h1>
    <p>Sem conexão com a internet. Verifique sua rede e tente novamente.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
